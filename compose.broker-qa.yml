# Archivo: Levanta la base PostgreSQL exclusivamente para la QA aislada de Broker OS.
name: evolum-broker-qa

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: evolum_test
      POSTGRES_PASSWORD: evolum_local_test_only
      POSTGRES_DB: evolum_broker_test
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - broker_qa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolum_test -d evolum_broker_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"

volumes:
  broker_qa_postgres:
