name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://evolum_test:evolum_test@127.0.0.1:5432/evolum_test
      JWT_SECRET: ci_test_secret_evolum_2026_minimum_32_characters
    defaults:
      run:
        working-directory: backend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend-v2/.node-version
          cache: npm
          cache-dependency-path: backend-v2/package-lock.json
      - run: npm ci
      - run: npm run audit:security
      - run: npm run prisma:generate
      - run: npm test

  finance-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: evolum_test
          POSTGRES_PASSWORD: evolum_local_test_only
          POSTGRES_DB: evolum_finance_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U evolum_test -d evolum_finance_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      CONFIRM_FINANCE_QA: "YES"
      QA_DATABASE_URL: postgresql://evolum_test:evolum_local_test_only@127.0.0.1:55432/evolum_finance_test
      QA_REDIS_URL: redis://127.0.0.1:56379/0
    defaults:
      run:
        working-directory: backend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend-v2/.node-version
          cache: npm
          cache-dependency-path: backend-v2/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run qa:migrate
      - run: npm run qa:migrate
      - run: npm run qa:status
      - run: npm run qa:schema
      - run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run audit:security
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
